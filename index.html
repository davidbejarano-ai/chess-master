<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chess Master</title>
  <meta name="description" content="Juega, analiza tus partidas y entrena tus puntos débiles en ajedrez.">
  <meta name="theme-color" content="#1f2a1f">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  </nav>
  <main id="view" tabindex="-1"></main>
  <div id="bg-progress" class="bg-progress hidden" role="status"></div>
  <script type="module" src="js/app.js"></script>
